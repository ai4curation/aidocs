site_name: "AI4Curators - AI Guides"
site_description: Documentation for AI for curation
theme:
  name: material
  custom_dir: docs/overrides  # This tells Material to look in docs/overrides/
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - content.code.copy

extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - meta
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  

nav:
  - Home: index.md
  - Case studies:
     - Overview: case-studies/index.md
     - Ontologies:
        - GO: case-studies/go-ontology.md
        - Uberon: case-studies/uberon.md
        - Mondo: case-studies/mondo.md
        - Cell Ontology: case-studies/cell-ontology.md
        - EFO: case-studies/efo.md
     - The mechs:
        - DisMech: case-studies/dismech.md
        - AI Gene Review: case-studies/ai-gene-review.md
        - CommunityMech: case-studies/communitymech.md
        - HabitatMech: case-studies/habitatmech.md
  - Patterns:
     - Overview: patterns/index.md
     - Make identifiers hard to fake: patterns/ground-identifiers.md
     - Regulate the loop: patterns/human-regulating-the-loop.md
     - Break work into skills: patterns/skills-before-automation.md
     - One source of instructions: patterns/one-source-of-instructions.md
     - Fast and slow validation: patterns/fast-and-slow-validation.md
     - Scanners find the work: patterns/scanners.md
     - One review checklist: patterns/review-checklists.md
     - Shared control: patterns/shared-control.md
     - Guard the untrusted surface: patterns/guard-untrusted-input.md
  - Curator how-tos:
     - Instruct the GitHub agent: how-tos/instruct-github-agent.md
     - Make identifiers hallucination-resistant: how-tos/make-ids-hallucination-resistant.md
     - Build your agentic harness: how-tos/build-agentic-harness.md
     - Write your own skills: how-tos/author-skills.md
  - Administrator how-tos:
     - Set up GitHub actions: how-tos/set-up-github-actions.md
     - Integrate AI into your KB: how-tos/integrate-ai-into-your-kb.md
     - Create an agentic curation pipeline: how-tos/create-agentic-curation-pipeline.md
     - PR reviews for agent improvement: how-tos/pr-reviews-for-agent-improvement.md
  - Tutorials:
     - Your first curation session: tutorials/first-curation-session.md
     - Training materials for curators: tutorials/tutorials-for-curators.md
  - Reference:
     - Harnesses: reference/harnesses.md
     - Bots:
        - Overview: reference/bots/index.md
        - ai4c-agent: reference/bots/ai4c-agent.md
        - ai4c-reviewer: reference/bots/ai4c-reviewer.md
        - claude: reference/bots/claude.md
        - copilot-swe-agent: reference/bots/copilot.md
        - dragon-ai-agent: reference/bots/dragon-ai-agent.md
     - Agentic tools: reference/agentic-tools.md
     - GitHub integrations: reference/github-integrations.md
     - GitHub Copilot: reference/github-copilot.md
     - Claude Skills: reference/claude-skills.md
  - Evidence: evidence.md
  - FAQ: faq.md
  - Glossary: glossary.md

site_url: https://ai4curation.io/aidocs/
repo_url: https://github.com/ai4curation/aidocs/
